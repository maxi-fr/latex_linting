[project]
name = "latex_linting"
version = "0.1.0"
description = "Linting plus review agents for thesis writing"
authors = [
    {name = "Max Frankenberg", email = "frankenbergmax57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.65.0",
    "httpx>=0.28.1",
    "pypdf>=6.18.1",
]

[project.scripts]
latex-lint = "latex_linting.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.3.0",
    "pre-commit>=3.0.0",
    "marimo>=0.23.8",
    "ty>=0.0.73",
    "validate-pyproject>=0.23",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = ["latex_linting"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "FIX",    # for comments like TODO, FIXME
    "TD",     # for structure of TODO comments
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "PGH003", # Use specific rule codes when ignoring type issues (simplified for ty)
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Single line implicit string concatenation (conflicts with formatter)
    "N806",   # Variable in function should be lowercase (e.g. matrices in math/control)
    "N803",   # Argument name should be lowercase (e.g. matrices in math/control)
    "CPY",    # Missing copyright notices at top of file
]

[tool.ruff.lint.isort]
# Ensures imports are grouped logically
known-first-party = ["latex_linting"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001", # Not a package — standalone runnable scripts
    "T201",   # print() is fine in CLI scripts
]
"examples/**" = [
    "INP001",  # Not a package
    "B018",    # Useless expression (Marimo displays last expression)
    "ANN",     # Missing type annotations in example cell signatures
    "PLR0913", # Too many arguments in cell definitions
    "PLR0917", # Too many positional arguments in cell definitions
    "N803",    # Argument name check (since we inject classes/matrices as cell arguments)
    "D",       # Ignore docstrings in examples
    "T201",    # print() is fine in examples
    "N807",    # Function name starting and ending with __ (standard in Marimo)
    "PLC0415", # Imports inside functions (standard in Marimo cells)
    "RET501",  # Redundant return statements (Marimo requires them, Ruff tries to remove them)
    "PLR1711", # Useless return statement at end of function (Marimo requires them, Ruff tries to remove them)
    "F821",    # Undefined name (Marimo cells use reactive arguments)
    "PLR2004", # Magic value comparisons in examples
    "RUF001",  # Ambiguous unicode characters (emojis in examples UI)
    "PLR0915", # Too many statements (complex layout and plotting code in cells)
    "C901",    # Too complex
    "PLR0912", # Too many branches
]
"tests/*" = [
    "S101",    # assert
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "F401",    # unused import
    "ARG001",  # Unused function args (fixtures)
    "PLR2004", # Magic value used in comparison
    "D",       # Ignore docstrings in tests
    "INP001",  # No __init__.py in tests folder
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Usually, keeping the comma helps with cleaner diffs in git
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -v"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default, opt-in with --runslow or -m slow)",
]

[tool.ty]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["examples/**"]  # For marimo notebooks

[tool.ty.rules]
# In ty, you control strictness by setting individual rules to "error", "warn", or "ignore".

invalid-assignment = "error"         # Assigning an incompatible type to a variable
invalid-argument-type = "error"      # Passing the wrong type to a function
invalid-return-type = "error"        # Returning a value that doesn't match the function's return annotation
unresolved-import = "error"          # Importing a module that cannot be found
unresolved-attribute = "error"       # Accessing an attribute that doesn't exist on that object type
unresolved-reference = "error"       # Using an undefined variable or name

possibly-missing-import = "error"    # Strict import resolution
unused-ignore-comment = "warn"       # Flagging a '# ty: ignore' comment that isn't doing anything
unused-type-ignore-comment = "warn"  # Flagging a standard '# type: ignore' that isn't doing anything
ignore-comment-unknown-rule = "warn" # Warns you if you try to ignore a rule that doesn't exist

index-out-of-bounds = "error"        # Static bounds checking on indexable collections (like tuples)
division-by-zero = "error"           # Catching literal division by zero statically
not-iterable = "error"               # Trying to use a non-iterable object in a loop
not-subscriptable = "error"          # Trying to index an object that doesn't support it

[[tool.ty.overrides]]
include = ["examples/**"]
rules = { unresolved-reference = "ignore" }
